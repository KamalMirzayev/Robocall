# Host-level nginx reverse proxy configuration — one per customer instance.
# deploy-prod.sh fills __FRONTEND_DOMAIN__ / __API_DOMAIN__ / __TELEPHONY_DOMAIN__
# and installs this at /etc/nginx/sites-available/<frontend-domain> (then ln -s
# to sites-enabled).
#
# This file includes HTTPS server blocks for the instance's domains.
# Certificates are expected at /etc/letsencrypt/live/__FRONTEND_DOMAIN__/.

upstream frontend {
    server 127.0.0.1:3001;
}

upstream api_backend {
    server 127.0.0.1:4000;
}

upstream telephony_backend {
    server 127.0.0.1:8090;
}

# HTTP -> HTTPS redirects
server {
    listen 80;
    listen [::]:80;
    server_name __FRONTEND_DOMAIN__ __TELEPHONY_DOMAIN__;

    location / {
        return 301 https://__FRONTEND_DOMAIN__$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location / {
        return 301 https://__API_DOMAIN__$request_uri;
    }
}

# Frontend HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __FRONTEND_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__FRONTEND_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FRONTEND_DOMAIN__/privkey.pem;

    # Security headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Frontend's Next.js API routes (callbot auth, health checks, etc.)
    location /api/callbot/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API routes - proxy telephony/SIP endpoints to the telephony backend
    location ~ ^/api/(telephony|sip-accounts|trunks|ivr|dialplan)/ {
        proxy_pass http://telephony_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # All other /api/* routes go to frontend for handling (may proxy to backend)
    location /api/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Live-monitor WebSocket (telephony backend, port 8090) — must come before
    # the catch-all location / below, since the frontend origin is what the
    # browser connects to (wss://__FRONTEND_DOMAIN__/ws/live-monitor), not the
    # telephony domain directly.
    location /ws/live-monitor {
        proxy_pass http://telephony_backend/ws/live-monitor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # WebSocket support for the API backend (/ws/gemini, /ws/monitor)
    location /ws/ {
        proxy_pass http://api_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Frontend catch-all
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API Backend HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__FRONTEND_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FRONTEND_DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Catch-all proxy to API backend
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PKS import execute can run long (fetches all pages, batch upserts).
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}

# Telephony Backend HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __TELEPHONY_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__FRONTEND_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FRONTEND_DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://telephony_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
